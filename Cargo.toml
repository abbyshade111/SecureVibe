[workspace]
resolver = "3"
members = ["crates/sv-frameworks", "crates/sv-manifest", "crates/sv-scan", "crates/sv-run", "crates/sv-check", "crates/sv-report",
    "crates/sv-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
regex = "1"
tree-sitter = "0.27"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.24"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-kotlin-ng = "1"
tree-sitter-rust = "0.24"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-swift = "0.7"
tree-sitter-dart = "0.2"
tree-sitter-bash = "0.25"
tree-sitter-yaml = "0.7"
anyhow = "1"

# The binary people download and the Docker image carry. Symbols stripped, nothing else: of its
# 35 MB, 27 MB is the parse tables of the fifteen tree-sitter grammars and 5 MB is code, so link-time optimization cut 1.4 MB for a build 30 s longer and no change in speed
# (measured in DESIGN, "A release profile"). Panics still unwind, so a run's containers are torn
# down when a check panics (`sv-run`'s `Teardown` is a `Drop`).
[profile.release]
strip = true
