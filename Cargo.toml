[workspace]
resolver = "3"
members = ["crates/sv-frameworks", "crates/sv-manifest", "crates/sv-scan", "crates/sv-run", "crates/sv-check", "crates/sv-report",
    "crates/sv-cli"]
# The fuzzing targets build on nightly Rust only, and are run apart from the tests (ADR-077).
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
regex = "1"
tree-sitter = "0.27"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.24"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-kotlin-ng = "1"
tree-sitter-rust = "0.24"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-swift = "0.7"
tree-sitter-dart = "0.2"
tree-sitter-bash = "0.25"
tree-sitter-yaml = "0.7"
anyhow = "1"

# The binary people download and the Docker image carry. Symbols stripped, nothing else: of its
# 35 MB, 27 MB is the parse tables of the fifteen tree-sitter grammars and 5 MB is code, so link-time optimization cut 1.4 MB for a build 30 s longer and no change in speed
# (measured in DESIGN, "A release profile"). Panics still unwind, so a run's containers are torn
# down when a check panics (`sv-run`'s `Teardown` is a `Drop`).
[profile.release]
strip = true

# The dependencies optimized in a debug build, `sv`'s own crates still unoptimized and debuggable.
# Measured on 8 October 2026 (BACKLOG, "From the architecture assessment of 8 October 2026", item 1):
# the 46 tree-sitter rule tests took 126 s with everything unoptimized and 32 s with this, since the
# parse tables, the regular expressions, and the hashing all live in dependencies that never change
# between test runs. The one-time cost is a longer first build of the dependencies.
[profile.dev.package."*"]
opt-level = 2
