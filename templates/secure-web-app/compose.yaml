# Runs this app in a container with one command:
#
#   docker compose up --build
#
# Then open http://127.0.0.1:3000 . To stop it: docker compose down . Your data stays in the "data" folder next to
# this file, so stopping, rebuilding or deleting the container never loses a record.
#
# Before the first run you need a settings file: copy .env.example to .env and run "npm run setup" once to generate
# the secrets (or run it inside the container with "docker compose run --rm app npm run setup").

services:
  app:
    build: .
    # Your secrets are read from .env when the container starts. They are never built into the image.
    env_file:
      - .env
    environment:
      # Inside the container the app listens on every address; the line below is what decides who can reach it.
      BIND_LAN: "1"
      DATA_DIR: /app/data
      PORT: "3000"
    ports:
      # "127.0.0.1:" is the important part: the app is reachable from this computer only, exactly as it is when you
      # run it without Docker. To let other devices on your network reach it, change this to "3000:3000" — and read
      # docs/deployment.md first, because that is a real change in who can reach your data.
      - "127.0.0.1:3000:3000"
    volumes:
      # The database, uploads and logs. Everything else in the container is thrown away when it stops.
      - ./data:/app/data
    # The app only ever writes to its data folder, so the rest of the container is read-only. If something tries to
    # change the code while it runs, it fails instead of succeeding quietly.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      # The container cannot gain more privileges than it starts with, whatever it runs.
      - no-new-privileges:true
    cap_drop:
      # None of the special powers a container can have are needed here, so none are given.
      - ALL
    # A stopped app is restarted, but not if you stopped it yourself.
    restart: unless-stopped
    # Handles Ctrl-C and shutdown signals properly, so the app closes its database cleanly.
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
