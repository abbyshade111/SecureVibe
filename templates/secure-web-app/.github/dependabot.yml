# Watches the things this app depends on and opens a pull request when one of them needs updating.
#
# Two lists are watched. The packages the app itself uses, and the ready-made steps the security workflow uses,
# which are code from other people too. The security workflow runs on every one of those pull requests, so an
# update that breaks the app or weakens it shows up before you merge it.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Security fixes arrive as their own pull requests whatever this grouping says.
    groups:
      all-packages:
        patterns: ['*']

  # The workflow pins each step to an exact fingerprint; these updates move the fingerprint and the version comment
  # together, so pinning never means falling behind on security fixes.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
