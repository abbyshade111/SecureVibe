# Checks this app every time its code changes, and once a week even when nothing changes, because the packages it
# depends on can become unsafe while the app sits still.
#
# The first job runs everywhere and needs nothing set up: it runs the app's own security tests, checks the packages
# for known problems, writes a bill of materials (the list of everything inside the app), builds the container and
# scans it. It fails if anything serious is found, so a change that weakens the app cannot be merged quietly.
#
# The second job is off until you turn it on. It publishes the container image, signs it, and attaches the bill of
# materials to that signature, so whoever runs your image can prove it came from this repository and see exactly
# what is inside it. To turn it on: repository Settings → Secrets and variables → Actions → Variables → new variable
# PUBLISH_IMAGE with the value true.

# Every ready-made step below is pinned to an exact fingerprint (the long number after the @), not to a version name.
# A version name can be moved to point at different code later; a fingerprint cannot. The comment beside each one
# says which release it is, and Dependabot updates both together when a new release comes out.

name: Security checks

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    # Mondays, 06:00 UTC: catches packages that became unsafe since the last change.
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Nothing here may write to the repository.
permissions:
  contents: read

jobs:
  checks:
    name: Tests, packages, bill of materials, container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm

      # --ignore-scripts: no package may run code of its own while being installed.
      - name: Install exactly the packages in the lockfile
        run: npm ci --ignore-scripts

      - name: Check the code compiles
        run: npm run typecheck

      # The security suite that ships with the app: sign-in, permissions, forms, headers, error handling.
      - name: Run the app's own security tests
        run: npm test

      - name: Check the packages for known problems
        run: npm audit --audit-level=high

      # CycloneDX is the standard format for a bill of materials; it lists every package and version in the app.
      - name: Write the bill of materials
        run: npm sbom --sbom-format cyclonedx --sbom-type application > sbom.cdx.json

      - name: Keep the bill of materials with this run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bill-of-materials
          path: sbom.cdx.json
          retention-days: 90

      - name: Build the container
        run: docker build -t app-under-test:${{ github.sha }} .

      # Looks inside the built image: the operating system packages as well as the app's own.
      - name: Scan the container for known problems
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: app-under-test:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  publish:
    name: Publish, sign and attest the image
    needs: checks
    # Off unless you set the PUBLISH_IMAGE variable to true (see the note at the top of this file).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLISH_IMAGE == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Lets GitHub vouch for this run so the image can be signed without any key to keep safe.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm

      - name: Install exactly the packages in the lockfile
        run: npm ci --ignore-scripts

      - name: Write the bill of materials
        run: npm sbom --sbom-format cyclonedx --sbom-type application > sbom.cdx.json

      - name: Sign in to the GitHub container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the image name and tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      # provenance and sbom ask Docker to record how the image was built and what went into it.
      - name: Build and publish the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless signing: the signature is tied to this repository and this workflow, and there is no private key
      # for anyone to steal or for you to look after.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${DIGEST}"

      - name: Attach the bill of materials to the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "ghcr.io/${{ github.repository }}@${DIGEST}"

      # GitHub's own record of how this image was built, checkable with "gh attestation verify".
      - name: Record how the image was built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
