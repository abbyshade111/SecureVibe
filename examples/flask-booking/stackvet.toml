# A Python/Flask booking app, as an AI coding tool would describe it after building it.
manifest-version = 1

[app]
name = "Clinic booking"
description = "Patients book appointments with a clinic; staff manage the diary."
audience = "customers"
deployment = "internet"

[stack]
languages = ["python"]

[stack.run]
image = "python:3.12-slim"
install = true           # the packages in requirements.txt, installed before the run (ADR-052)
# Deliberately wrong: 127.0.0.1 is answered only from inside the app's own container, and `sv run` asks from
# another, so a real app listens on 0.0.0.0. It is left here for `sv preflight` to point out
# (crates/sv-cli/tests/preflight.rs). This example has no tests of its own, so there is no `test` line.
start = "gunicorn -b 127.0.0.1:$PORT app:app"
health = "/healthz"

[data]
categories = ["contact", "health"]

[capabilities]
auth = true
oauth = true              # patients sign in with Google
authorization-server = false  # nothing signs in through this app
jwt = true
uploads = true
payments = false
email = true
public-api = false
scheduler = true
multi-tenant = false
webrtc = false
external-apis = ["api.sendgrid.com"]
tls = "terminated-upstream"

out-of-band-auth = false
shared-hostname = false

[repository]
ci-cd = true            # GitHub Actions
hosted-scm = true       # GitHub, with branch protection
outside-contributors = false
iac = false

[capabilities.ai]
enabled = false
