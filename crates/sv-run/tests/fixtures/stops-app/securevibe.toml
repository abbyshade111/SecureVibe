manifest-version = 1

[app]
name = "Stops fixture"
audience = "just-me"
deployment = "local-only"

[stack]
languages = []

[stack.run]
# busybox, as the other fixtures. `/cgi-bin/stop.sh` stops the server the way an unhandled error
# stops an app, so the run can see it is gone afterwards; nothing else here does anything.
image = "busybox:1.36"
start = "httpd -f -h /app -p $PORT"
health = "/cgi-bin/home.sh"
