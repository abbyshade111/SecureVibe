[package]
name = "sv-check"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
toml.workspace = true
regex = "1"
tree-sitter.workspace = true
tree-sitter-python.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-go.workspace = true
tree-sitter-ruby.workspace = true
tree-sitter-php.workspace = true
tree-sitter-java.workspace = true
tree-sitter-c-sharp.workspace = true
tree-sitter-kotlin-ng.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-c.workspace = true
tree-sitter-cpp.workspace = true
tree-sitter-swift.workspace = true
tree-sitter-dart.workspace = true
tree-sitter-bash.workspace = true
tree-sitter-yaml.workspace = true
sv-frameworks = { path = "../sv-frameworks" }
sv-scan = { path = "../sv-scan" }
sv-manifest = { path = "../sv-manifest" }
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"
# SSH-format Ed25519 signatures for `sv review`'s seals (ADR-043): a key made from the system's
# randomness, kept in OpenSSH's own format, with a passphrase if the owner wants one.
ssh-key = { version = "0.6.7", default-features = false, features = ["std", "ed25519", "encryption", "getrandom"] }
ssh-encoding = { version = "0.2", features = ["alloc"] }

[dev-dependencies]
sv-frameworks = { path = "../sv-frameworks" }
