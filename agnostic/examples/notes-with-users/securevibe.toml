manifest-version = 1

# An example of [stack.run.users]: `sv run` makes two accounts and an admin with `seed`, signs in as
# each, and asks what they can reach — each other's notes, the admin page, a note created from
# another site, the session after signing out — and signs up through `signup` to ask what passwords
# the app accepts.

[app]
name = "Notes with users"
description = "Private notes, one account each, and an admin page."
audience = "customers"
deployment = "internet"

[stack]
languages = ["python"]

[stack.run]
image = "python:3.12-slim"
start = "python app.py"
health = "/"

[stack.run.users]
seed = "python seed.py"
# Used only for the password questions: the test users and the admin come from `seed`.
signup = { path = "/signup", form = { email = "{user}", password = "{password}", csrf_token = "{csrf}" } }
login = { path = "/login", form = { email = "{user}", password = "{password}", csrf_token = "{csrf}" } }
logout = { path = "/logout", form = { csrf_token = "{csrf}" } }
private = ["/account"]
admin = ["/admin"]
owned = { create = { path = "/notes", form = { text = "{marker}", csrf_token = "{csrf}" } } }
change-password = { path = "/password", form = { current = "{password}", new = "{new_password}", csrf_token = "{csrf}" } }
delete-account = { path = "/account/delete", form = { password = "{password}", csrf_token = "{csrf}" } }
upload = { path = "/upload", field = "file", form = { csrf_token = "{csrf}" }, serves-at = "/files/{name}", max-bytes = 65536 }

[data]
categories = ["contact"]

[capabilities]
auth = true
uploads = true
tls = "terminated-upstream"
