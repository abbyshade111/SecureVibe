[workspace]
resolver = "3"
members = ["crates/sv-frameworks", "crates/sv-manifest", "crates/sv-scan", "crates/sv-run", "crates/sv-check", "crates/sv-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
regex = "1"
anyhow = "1"
