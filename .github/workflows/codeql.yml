# CodeQL, set up as a committed workflow ("advanced setup") rather than GitHub's default setup.
#
# The reason is the fixtures. SecureVibe tests its own scanners on deliberately vulnerable applications
# (crates/sv-scan/tests/fixtures and crates/sv-check/tests/fixtures),
# and with default setup every one of their faults is a real alert in the Security tab: eighteen were dismissed
# by hand on 22 September 2026, sixteen of them from v1's fixtures. A dismissal is a click that lives only in
# GitHub's web page and comes back for every branch and every new fixture; the list below is one reviewable line
# per folder and applies everywhere at once. Default setup cannot read a configuration file at all, so this is the
# only way to say it.
#
# GitHub refuses to run this workflow while default setup is still switched on. Turning it off is a repository
# setting (Settings → Code security → CodeQL) and is the owner's to change. It has been off since: on 8 October
# 2026 this workflow was running on every push to main and every pull request, and passing.
#
# Two things learnt on 23 September 2026, by running it rather than reading about it:
#  - Suppression comments are NOT honored by these packs. `// codeql[js/...]` and `// lgtm[js/...]` on the
#    flagged line (harness.ts and http.ts, headers.ts as the control) left every alert in place. A deliberate
#    choice is therefore recorded two ways: the reason in a comment beside the code, and a dismissal with the
#    same reason in the Security tab. Neither alone is enough.
#  - A dismissal is tied to the alert's fingerprint, which includes the line's text: edit or move the flagged
#    line (even to add that comment) and the alert returns as a new one, "in code changed by this pull request".
#    Expect to dismiss it again; it is the same finding.
#  - The same family of protection guards pushes: GitHub push protection refuses a push whose commit holds a
#    key-shaped string, and it fired on 23 September 2026 on a *secrets scanner's own test data*. The failure
#    arrives as a rejected push (GH013), not a test failure, and a follow-up commit does not clear it because the
#    blob is in the rejected commit. Do not use the offered "allow this secret" link on this project: build test
#    keys from pieces at run time (`['sk', 'live', '…'].join('_')`) so the rule sees a key and the file holds none,
#    and keep the fixture apps' credentials visibly fake, as they are.
#
# Every action is pinned to an exact commit fingerprint, as in rust.yml: a version name can be moved, a
# fingerprint cannot. The comment beside each says which release it is.

name: CodeQL

on:
  # By hand first: after default setup is switched off, run it once deliberately and see it go green before
  # letting pushes and pull requests carry it.
  workflow_dispatch:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  schedule:
    - cron: '0 6 * * 1' # Mondays, 06:00 UTC: the query packs improve while nothing changes here.

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Every language this repository runs, and only what it runs. Rust is `sv` itself. JavaScript is the three
        # helpers `sv run` starts beside the app under test (crates/sv-run/assets/*.mjs: a browser driver, a stand-in
        # AI model service, and a stand-in sign-in provider); they are real code, not test inputs, and went unscanned
        # until 27 September 2026 because this comment said the only JavaScript was in fixtures. Python is the scripts
        # in tools/. The fixtures and the sample apps in examples/ are excluded below, so each leg sees only these.
        language: ['rust', 'javascript-typescript', 'python']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The token stays out of the checked-out folder, so nothing that runs later in the job
        # (a build script, a test, a package from outside) can read it. `sv check` reports this (AC.12.2).
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: |
            paths-ignore:
              # Deliberately vulnerable inputs for SecureVibe's own scanner tests. They exist to be found by
              # sv-scan; an alert on one of them is the fixture doing its job. Do not "fix" them and do not
              # un-exclude them.
              - crates/sv-scan/tests/fixtures/**
              # The same for the adapter tests: apps written with one of each fault for bandit, gosec,
              # Brakeman and semgrep to find, kept beside those tools' real reports. The first JavaScript
              # among them (semgrep-aisvs/app/assistant.js, user input in a system prompt) was flagged on
              # 25 September 2026 for exactly the fault it was written to contain.
              - crates/sv-check/tests/fixtures/**
              # The sample apps `sv` is tried on. Some leave a protection out on purpose (oidc-notes reads a
              # list of checks to skip from flaws.json), so that a report shows what `sv` finds when one is
              # missing; they are inputs for `sv`, like the fixtures, not code this repository runs.
              - examples/**
              # Build output.
              - target/**

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: '/language:${{ matrix.language }}'
