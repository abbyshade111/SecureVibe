# The Rust checks for `sv`, which is what this repository is. (Until 26 September 2026 the repository held SecureVibe v1
# at its top and `sv` under `agnostic/`; v1 now lives on the `v1` branch and at the tags `v1-paper` and `v1-final`.)
#
# It runs on every push and pull request: the tests read `data/`, `docs/` and `examples/` as well as the crates, and a
# change to any of them can break a guard, so nothing is filtered out by path. `sv` reads the OWASP data in `data/`,
# and its suite asserts things about it: that exactly two `never` rules survive the overlay, that the set of
# conditions no rule keys on is the one we think, and that every condition named in the data files exists in the
# Rust enum.
#
# Every step is pinned to an exact commit fingerprint rather than a version name: a version name can be moved to
# point at different code, a fingerprint cannot.

name: Rust

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every commit on main is tested (ADR-051): there the group is the commit, so no run waits behind
# another. With one group for all of main, GitHub kept only the newest waiting run and cancelled the
# rest, whatever cancel-in-progress said: 19 of 50 runs on main on 7 October 2026 never finished. On
# any other branch a newer push still cancels a run still going, since only a pull request's newest
# commit can be merged. Publishing has a group of its own below.
concurrency:
  group: rust-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite took 14 to 15 minutes by 5 October 2026, and runs on main and on branches were being stopped
    # at 15 with the tests unfinished. Room to grow; the repository is public, so the minutes cost nothing.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The token stays out of the checked-out folder, so nothing that runs later in the job
        # (a build script, a test, a package from outside) can read it. `sv check` reports this (AC.12.2).
        with:
          persist-credentials: false

      # No cache step. Caching would mean pinning another third-party action, and this workspace builds from
      # scratch in well under a minute — a smaller supply-chain surface is worth more here than the seconds.
      - name: Use the toolchain this workspace needs
        # edition 2024 and resolver 3 need a recent stable; the runner image ships one, but saying so explicitly
        # means a runner image change fails here with a clear reason rather than a syntax error in a crate.
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        # The fence tests need a container backend. GitHub's runners have Docker, so they run for real here;
        # where there is none they assert the honest-absence path instead and say which branch they took.
        # Every credit a check gives is written to this file (a debug build only; `Verified::new`), so
        # the next step can hold the findings-only lists in tools/coverage.py to what really happened.
        # SV_REQUIRE_BACKEND makes Docker's absence a failure here (crates/sv-run/tests/fence.rs), so a
        # runner whose Docker broke turns this red rather than every fence test passing on the
        # no-backend path.
        env:
          SV_CREDIT_LOG: ${{ runner.temp }}/credits.log
          SV_REQUIRE_BACKEND: "1"
        run: cargo test --workspace

      - name: What the suite saw credited
        # Fails when a check listed as only ever a finding was credited, or one never credited is not
        # listed. By 6 October 2026, 23 checks had been counted as crediting when none ever did.
        run: python3 tools/coverage.py --credits "$RUNNER_TEMP/credits.log"

  image:
    # The container for somebody who is not going to install Rust (the Dockerfile). Built from
    # scratch here, where Docker Hub is reachable, and driven over MCP the way an AI coding tool
    # would drive it: tools/image_smoke.py asserts the committed-secrets check really ran, in the
    # image and in a native sv, before comparing what the two found. The runner is an ordinary user,
    # so the file the image writes has to come out owned by that user, and a run as root over the
    # runner's folder is what shows `safe.directory` is needed. Built, not published.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build --build-arg SV_GIT_COMMIT=${{ github.sha }} -t securevibe/sv .

      - name: Build sv natively, to compare with
        run: rustup toolchain install stable --profile minimal && rustup default stable && cargo build --release -p sv-cli

      - name: Drive the image as an AI coding tool would
        run: python3 tools/image_smoke.py securevibe/sv --native target/release/sv --commit ${{ github.sha }}

  publish:
    # Publishes the image to GitHub's container registry, at the owner's decision (26 September
    # 2026), as ghcr.io/abbyshade111/securevibe-sv: `latest`, and the commit it was built from. Only
    # for a push to main, and only once `test` and `image` have passed on that same commit, so what
    # is published is what the smoke test drove. It is the one job that may write packages; every
    # other job keeps the read-only permission above. No third-party action: `docker login` with the
    # workflow's own token, which lasts for this run only.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, image]
    # One publish at a time. A publish already going is never cancelled; one waiting behind it is
    # replaced by a newer one, which only skips an image already out of date.
    concurrency:
      group: rust-publish-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/abbyshade111/securevibe-sv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        # The source label ties the package to this repository on GitHub, so it is listed there and
        # takes its access from it.
        run: >
          docker build
          --label org.opencontainers.image.source=https://github.com/${{ github.repository }}
          --label org.opencontainers.image.revision=${{ github.sha }}
          --build-arg SV_GIT_COMMIT=${{ github.sha }}
          -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" .

      - name: Publish it
        # Runs on main can finish out of order now that each commit has its own, so `latest` moves
        # only when this commit is still the newest on main; the commit's own tag is always pushed.
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${{ github.sha }}"
          git fetch --depth=1 origin main
          if [ "$(git rev-parse FETCH_HEAD)" = "${{ github.sha }}" ]; then
            docker push "$IMAGE:latest"
          else
            echo "main has moved past ${{ github.sha }}; latest is left to the newer commit's run"
          fi
          docker logout ghcr.io
